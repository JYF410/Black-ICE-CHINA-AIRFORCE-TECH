l_english:

 ad_chi_tech_hawk3:0 "Curtiss Hawk III"
 ad_chi_tech_hawk3_desc:0 "The Curtiss Hawk III was the backbone of the Chinese Air Force in 1937; its mixed armament and dive-bombing capability made it the most numerous Chinese fighter of the opening campaigns."
 ad_chi_tech_i152:0 "Polikarpov I-15bis"
 ad_chi_tech_i152_desc:0 "Soviet I-15bis biplanes arrived with the 1937 aid packages and bore the brunt of the fighting over Wuhan and Chongqing."
 ad_chi_tech_i16t10:0 "Polikarpov I-16 Type 10"
 ad_chi_tech_i16t10_desc:0 "The I-16 Type 10 monoplane gave Chinese pilots a fast, heavily armed fighter able to challenge Japanese bombers over the interior."
 ad_chi_tech_i16t24:0 "Polikarpov I-16 Type 24"
 ad_chi_tech_i16t24_desc:0 "The Type 24 was the definitive I-16: four ShKAS, a strengthened wing and a more powerful M-62 engine."
 ad_chi_tech_p40b:0 "Curtiss P-40B Warhawk"
 ad_chi_tech_p40b_desc:0 "Delivered with the American Volunteer Group, the P-40B gave China a modern monoplane fighter with heavy .50 calibre armament."
 ad_chi_tech_p40e:0 "Curtiss P-40E Warhawk"
 ad_chi_tech_p40e_desc:0 "Replacing the four-gun wing with six .50 calibre guns, the P-40E became the standard fighter of the Chinese-American Composite Wing."
 ad_chi_tech_p47d:0 "Republic P-47D Thunderbolt"
 ad_chi_tech_p47d_desc:0 "The heavy, tough Thunderbolt arrived late in the war and excelled at escorting bombers and strafing river traffic."
 ad_chi_tech_p51d:0 "North American P-51D Mustang"
 ad_chi_tech_p51d_desc:0 "The Mustang's laminar wing and Packard-Merlin engine made it the best long-range escort fighter available to Chinese squadrons."
 ad_chi_tech_p80a:0 "Lockheed P-80A Shooting Star"
 ad_chi_tech_p80a_desc:0 "First-generation jet fighters offered to the post-war Chinese Air Force; the P-80A set the standard for the new jet age."
 ad_chi_tech_ki27:0 "Nakajima Ki-27"
 ad_chi_tech_ki27_desc:0 "Captured and repaired Ki-27 airframes were pressed into Chinese service for training and local patrols."
 ad_chi_tech_i153:0 "Polikarpov I-153"
 ad_chi_tech_i153_desc:0 "The gull-winged Chaika was the last Soviet biplane fighter supplied to China and fought on into 1941."
 ad_chi_tech_ki43:0 "Nakajima Ki-43 Hayabusa"
 ad_chi_tech_ki43_desc:0 "Lightly built and extremely manoeuvrable, the Hayabusa was the Japanese Army's main fighter and a prized capture."
 ad_chi_tech_a6m2:0 "Mitsubishi A6M2 Zero"
 ad_chi_tech_a6m2_desc:0 "Zero fighters recovered from crashed or captured examples were evaluated and flown against their former owners."
 ad_chi_tech_ki61:0 "Kawasaki Ki-61 Hien"
 ad_chi_tech_ki61_desc:0 "The liquid-cooled Hien was the only Japanese inline-engine fighter of the war; captured examples were carefully studied."
 ad_chi_tech_ki84:0 "Nakajima Ki-84 Hayate"
 ad_chi_tech_ki84_desc:0 "Fast and heavily armed, the Hayate was the best Japanese Army fighter to reach China and a valuable late-war prize."
 ad_chi_tech_la9:0 "Lavochkin La-9"
 ad_chi_tech_la9_desc:0 "All-metal La-9 fighters equipped the first post-war aviation regiments and later flew in Korea."
 ad_chi_tech_mig9:0 "Mikoyan-Gurevich MiG-9"
 ad_chi_tech_mig9_desc:0 "The MiG-9 was the Soviet Union's first operational jet fighter and the type that began Chinese jet aviation."
 ad_chi_tech_gamma2e:0 "Northrop Gamma 2E"
 ad_chi_tech_gamma2e_desc:0 "The Gamma 2E light attack bomber was licence-assembled in China and used against Japanese columns in 1937."
 ad_chi_tech_hs123:0 "Henschel Hs 123"
 ad_chi_tech_hs123_desc:0 "Twelve Hs 123 dive bombers were bought from Germany in 1937 and flew close-support sorties until 1941."
 ad_chi_tech_a19:0 "Vultee A-19"
 ad_chi_tech_a19_desc:0 "The A-19 (V-11) attack bomber was China's most modern ground-attack type of the late 1930s, armed with a 20mm cannon."
 ad_chi_tech_mosquito_fb6:0 "De Havilland Mosquito FB Mk VI"
 ad_chi_tech_mosquito_fb6_desc:0 "Wooden, fast and hard-hitting, the Mosquito fighter-bomber gave Chinese squadrons a precision strike capability."
 ad_chi_tech_il10:0 "Ilyushin Il-10"
 ad_chi_tech_il10_desc:0 "The Il-10 armoured ground-attack aircraft became the standard close-support type of the new Chinese air force."
 ad_chi_tech_he111a:0 "Heinkel He 111A"
 ad_chi_tech_he111a_desc:0 "China bought early He 111 bombers in 1936; they flew the first long-range raids on Japanese positions."
 ad_chi_tech_sb2m:0 "Tupolev SB 2M"
 ad_chi_tech_sb2m_desc:0 "Soviet SB bombers formed the core of the Chinese bomber force and raided bases in Formosa and Japan-held territory."
 ad_chi_tech_br20:0 "Fiat BR.20 Cicogna"
 ad_chi_tech_br20_desc:0 "A small batch of Italian BR.20 bombers served with the Chinese Air Force in the late 1930s."
 ad_chi_tech_db3:0 "Ilyushin DB-3"
 ad_chi_tech_db3_desc:0 "The long-range DB-3 flew the famous leaflet raids over Japan in 1938 and remained China's heavy bomber."
 ad_chi_tech_b25c:0 "North American B-25C Mitchell"
 ad_chi_tech_b25c_desc:0 "Lend-lease Mitchells equipped the Chinese-American Composite Wing's bomber squadrons."
 ad_chi_tech_tu2:0 "Tupolev Tu-2"
 ad_chi_tech_tu2_desc:0 "The Tu-2 fast bomber became the mainstay of the post-war Chinese bomber force."
 ad_chi_tech_b24j:0 "Consolidated B-24J Liberator"
 ad_chi_tech_b24j_desc:0 "Four-engine Liberators gave China a genuine strategic bombing capability against Japan's supply lines."
 ad_chi_tech_g4m2:0 "Mitsubishi G4M2"
 ad_chi_tech_g4m2_desc:0 "Captured G4M2 bombers were used for maritime patrol and transport duties at the end of the war."
 ad_chi_tech_ki15:0 "Mitsubishi Ki-15"
 ad_chi_tech_ki15_desc:0 "Fast reconnaissance aircraft bought from Japan before the war provided the Chinese Air Force's eyes."
 ad_chi_tech_pby5:0 "Consolidated PBY-5 Catalina"
 ad_chi_tech_pby5_desc:0 "Catalina flying boats performed maritime patrol, search and rescue along the Yangtze and the southern coast."
 ad_chi_tech_c47:0 "Douglas C-47 Skytrain"
 ad_chi_tech_c47_desc:0 "The C-47 became the backbone of the Hump airlift, hauling supplies over the Himalayas into China."
 ad_chi_tech_f5:0 "Lockheed F-5 Lightning"
 ad_chi_tech_f5_desc:0 "Photo-reconnaissance Lightning variants mapped Japanese dispositions across the China theatre."
 ad_chi_tech_mosquito_pr:0 "De Havilland Mosquito PR Mk IX"
 ad_chi_tech_mosquito_pr_desc:0 "High-altitude Mosquito reconnaissance aircraft flew deep missions over occupied China and Japan."
 ad_chi_tech_engine_r1820:0 "$ad_engine_usa_r1820_1x$"
 ad_chi_tech_engine_r1820_desc:0 "Licence-built Wright Cyclone radials powered the Hawk III and Gamma 2E."
 ad_chi_tech_engine_v1710:0 "$ad_engine_usa_v1710_1x$"
 ad_chi_tech_engine_v1710_desc:0 "The V-1710 inline engine was the standard powerplant of the P-40 family."
 ad_chi_tech_engine_r2800:0 "$ad_engine_usa_r2800_1x$"
 ad_chi_tech_engine_r2800_desc:0 "The 2,000 hp Double Wasp gave the Thunderbolt its speed and ruggedness."
 ad_chi_tech_engine_v1650:0 "$ad_engine_usa_v1650_1x$"
 ad_chi_tech_engine_v1650_desc:0 "Licence-built Rolls-Royce Merlins turned the Mustang into a long-range escort fighter."
 ad_chi_tech_engine_r2600:0 "$ad_engine_usa_r2600_2x$"
 ad_chi_tech_engine_r2600_desc:0 "Twin Cyclones powered the B-25 Mitchell medium bomber."
 ad_chi_tech_engine_r1830:0 "$ad_engine_usa_r1830_2x$"
 ad_chi_tech_engine_r1830_desc:0 "Fourteen-cylinder Twin Wasps powered the C-47, the PBY and the B-24."
 ad_chi_tech_engine_j33:0 "$ad_engine_usa_j33_1x$"
 ad_chi_tech_engine_j33_desc:0 "The J33 centrifugal-flow turbojet powered the P-80 Shooting Star."
 ad_chi_tech_engine_m25:0 "$ad_engine_sov_m25_1x$"
 ad_chi_tech_engine_m25_desc:0 "The M-25 radial was the standard engine of the I-15 and early I-16 fighters."
 ad_chi_tech_engine_m62:0 "$ad_engine_sov_m62_1x$"
 ad_chi_tech_engine_m62_desc:0 "The uprated M-62 powered the I-16 Type 24 and the I-153."
 ad_chi_tech_engine_m82:0 "$ad_engine_sov_m82_1x$"
 ad_chi_tech_engine_m82_desc:0 "The M-82 family powered the La-5/La-9 fighters and the Tu-2 bomber."
 ad_chi_tech_engine_am42:0 "$ad_engine_sov_am42_1x$"
 ad_chi_tech_engine_am42_desc:0 "The AM-42 was developed for the Il-10 armoured attack aircraft."
 ad_chi_tech_engine_m103:0 "$ad_engine_sov_m103_2x$"
 ad_chi_tech_engine_m103_desc:0 "Twin M-103 inlines powered the SB 2M fast bomber."
 ad_chi_tech_engine_m34:0 "$ad_engine_sov_m34_2x$"
 ad_chi_tech_engine_m34_desc:0 "The M-34 powered the DB-3 long-range bomber."
 ad_chi_tech_engine_rd20:0 "$ad_engine_sov_rd20_2x$"
 ad_chi_tech_engine_rd20_desc:0 "The RD-20 was a Soviet copy of the Junkers Jumo 004 and powered the MiG-9."
 ad_chi_tech_engine_kotobuki:0 "$ad_engine_kotobuki_1x$"
 ad_chi_tech_engine_kotobuki_desc:0 "The Kotobuki radial powered the Ki-27 fighter and Ki-15 reconnaissance aircraft."
 ad_chi_tech_engine_sakae:0 "$ad_engine_sakae_1x$"
 ad_chi_tech_engine_sakae_desc:0 "The Sakae 14-cylinder radial powered the A6M Zero and the Ki-43 Hayabusa."
 ad_chi_tech_engine_homare:0 "$ad_engine_homare_1x$"
 ad_chi_tech_engine_homare_desc:0 "The 1,900 hp Homare powered the Ki-84 Hayate."
 ad_chi_tech_engine_kasei:0 "$ad_engine_kasei_2x$"
 ad_chi_tech_engine_kasei_desc:0 "Twin Kasei radials powered the G4M bomber family."
 ad_chi_tech_engine_bmw132:0 "$ad_engine_bmw_132_1x$"
 ad_chi_tech_engine_bmw132_desc:0 "The BMW 132 powered the Hs 123 dive bomber."
 ad_chi_tech_engine_bmw_vi:0 "$ad_engine_bmw_vi_2x$"
 ad_chi_tech_engine_bmw_vi_desc:0 "Twin BMW VI engines powered the early He 111A bombers sold to China."
 ad_chi_tech_engine_merlin:0 "$ad_engine_merlin_20_28_38_2x$"
 ad_chi_tech_engine_merlin_desc:0 "Twin Merlin XX engines gave the Mosquito its exceptional speed."
 ad_chi_tech_gun_m1919:0 "$ad_mg_m1919_1x$"
 ad_chi_tech_gun_m1919_desc:0 "The standard American light machine gun arming early Chinese fighters."
 ad_chi_tech_gun_shkas:0 "$ad_mg_shkas_1x$"
 ad_chi_tech_gun_shkas_desc:0 "The high-rate ShKAS armed Polikarpov fighters and Soviet-supplied bombers."
 ad_chi_tech_gun_mg17:0 "$ad_mg17_1x$"
 ad_chi_tech_gun_mg17_desc:0 "German 7.92mm machine guns including the flexible MG 81 for turrets."
 ad_chi_tech_gun_m2:0 "$ad_mg_m2_1x$"
 ad_chi_tech_gun_m2_desc:0 "Heavy .50 calibre Browning guns gave American-supplied fighters real hitting power."
 ad_chi_tech_gun_type89:0 "$ad_mg_type89_1x$"
 ad_chi_tech_gun_type89_desc:0 "Japanese Army 7.7mm guns recovered from captured aircraft."
 ad_chi_tech_gun_shvak20:0 "$ad_cannon_shvak20_1x$"
 ad_chi_tech_gun_shvak20_desc:0 "The ShVAK cannon was the standard Soviet 20mm aircraft weapon."
 ad_chi_tech_gun_ubs:0 "$ad_mg_ubs_1x$"
 ad_chi_tech_gun_ubs_desc:0 "The UBS heavy machine gun replaced ShKAS in late-war Soviet fighters."
 ad_chi_tech_gun_type99:0 "$ad_cannon_type99_2x$"
 ad_chi_tech_gun_type99_desc:0 "The Type 99 cannon was the main armament of Zero and Hayabusa fighters."
 ad_chi_tech_gun_hispano:0 "$ad_cannon_hispano_1_1x$"
 ad_chi_tech_gun_hispano_desc:0 "British-built Hispano cannon armed the Mosquito night and strike variants."
 ad_chi_tech_gun_ho103:0 "$ad_mg_ho103_1x$"
 ad_chi_tech_gun_ho103_desc:0 "The Ho-103 heavy machine gun armed late Japanese Army fighters."
 ad_chi_tech_gun_ns23:0 "$ad_cannon_ns23_1x$"
 ad_chi_tech_gun_ns23_desc:0 "The NS-23 became the standard jet-age Soviet cannon, arming the Il-10 and MiG-9."
 ad_chi_tech_ord_fab100:0 "$ad_bomb_fab100_1x$"
 ad_chi_tech_ord_fab100_desc:0 "Soviet 100 kg general-purpose bomb used by SB and DB-3 bombers."
 ad_chi_tech_ord_ao10:0 "$ad_bomb_ao10_1x$"
 ad_chi_tech_ord_ao10_desc:0 "Light fragmentation bombs for anti-personnel attacks by Polikarpov fighters."
 ad_chi_tech_ord_fab250:0 "$ad_baybomb_fab250_2x$"
 ad_chi_tech_ord_fab250_desc:0 "The 250 kg FAB became the standard medium bomb of Chinese bombers."
 ad_chi_tech_ord_fab500:0 "$ad_baybomb_fab500_1x$"
 ad_chi_tech_ord_fab500_desc:0 "Heavy 500 kg bombs for attacks on ports and railway junctions."
 ad_chi_tech_ord_anm30:0 "$ad_bomb_anm30_1x$"
 ad_chi_tech_ord_anm30_desc:0 "American 100 lb general-purpose bombs for lend-lease aircraft."
 ad_chi_tech_ord_rs82:0 "$ad_rocket_rs82_1x$"
 ad_chi_tech_ord_rs82_desc:0 "Soviet 82mm air-to-ground rockets used against columns and shipping."
 ad_chi_tech_ord_type92:0 "$ad_baybomb_a_type92_250kg$"
 ad_chi_tech_ord_type92_desc:0 "Japanese 250 kg bombs recovered for use on captured bombers."
 ad_chi_tech_ord_anm57:0 "$ad_bomb_anm57_1x$"
 ad_chi_tech_ord_anm57_desc:0 "The 250 lb AN-M57 was the workhorse bomb of the China theatre."
 ad_chi_tech_ord_hvar:0 "$ad_rocket_hvar_2x$"
 ad_chi_tech_ord_hvar_desc:0 "High-velocity aircraft rockets gave late-war fighters a powerful anti-ship punch."
 SLOT_chinaair_folder:0 "§YChinese Air Force§!\n"
 chinaair_folder:0 "Chinese Air Force"
 chinaair_folder_tab:0 "Chinese Air Force"
