l_simp_chinese:

 ad_chi_tech_hawk3:0 "霍克 III"
 ad_chi_tech_hawk3_desc:0 "霍克 III 是 1937 年中国空军的主力机型，既可空战也能俯冲轰炸，是抗战初期装备数量最多的战斗机。"
 ad_chi_tech_i152:0 "伊-15 比斯"
 ad_chi_tech_i152_desc:0 "苏联援华的伊-15 比斯双翼机随 1937 年援助抵达，在武汉、重庆上空承担了繁重的空战任务。"
 ad_chi_tech_i16t10:0 "伊-16 10 型"
 ad_chi_tech_i16t10_desc:0 "伊-16 10 型单翼战斗机让中国飞行员第一次拥有足以拦截日军轰炸机的速度与火力。"
 ad_chi_tech_i16t24:0 "伊-16 24 型"
 ad_chi_tech_i16t24_desc:0 "24 型是伊-16 系列的成熟版本：四挺 ShKAS 机枪、加强机翼与功率更大的 M-62 发动机。"
 ad_chi_tech_p40b:0 "P-40B 战鹰"
 ad_chi_tech_p40b_desc:0 "随美国志愿航空队来华，P-40B 以 12.7 毫米重机枪和坚固结构为中国提供了现代化战斗机。"
 ad_chi_tech_p40e:0 "P-40E 战鹰"
 ad_chi_tech_p40e_desc:0 "P-40E 以六挺 12.7 毫米机枪取代早期的四挺配置，成为中美混合联队的标准战斗机。"
 ad_chi_tech_p47d:0 "P-47D 雷电"
 ad_chi_tech_p47d_desc:0 "P-47D 结构坚固、火力凶猛，在战争后期承担护航与扫射日军内河运输的任务。"
 ad_chi_tech_p51d:0 "P-51D 野马"
 ad_chi_tech_p51d_desc:0 "层流翼设计与帕卡德-梅林发动机使 P-51D 成为中国空军最优秀的远程护航战斗机。"
 ad_chi_tech_p80a:0 "P-80A 流星"
 ad_chi_tech_p80a_desc:0 "战后中国空军接触到的第一代喷气战斗机，P-80A 为喷气时代确立了新标准。"
 ad_chi_tech_ki27:0 "九七式战斗机"
 ad_chi_tech_ki27_desc:0 "缴获修复的九七式战斗机被编入中国空军，用于训练与局部巡逻。"
 ad_chi_tech_i153:0 "伊-153 海鸥"
 ad_chi_tech_i153_desc:0 "海鸥翼的伊-153 是苏联援助中国的最后一种双翼战斗机，一直使用到 1941 年。"
 ad_chi_tech_ki43:0 "一式战斗机二型"
 ad_chi_tech_ki43_desc:0 "一式战以轻巧灵活著称，是日本陆军航空队的主力战斗机，也是中国空军重点搜集的缴获机型。"
 ad_chi_tech_a6m2:0 "零式舰战二一型"
 ad_chi_tech_a6m2_desc:0 "从坠毁或缴获的零式战机中修复的机体被用于评估，并反过来投入对日作战。"
 ad_chi_tech_ki61:0 "三式战斗机一型"
 ad_chi_tech_ki61_desc:0 "三式战是战争中唯一采用液冷直列发动机的日军战斗机，缴获机体被仔细研究。"
 ad_chi_tech_ki84:0 "四式战斗机一型"
 ad_chi_tech_ki84_desc:0 "四式战速度快、火力强，是投入中国战场的最优秀日本陆军战斗机，也是战争后期的重要战利品。"
 ad_chi_tech_la9:0 "拉-9"
 ad_chi_tech_la9_desc:0 "全金属结构的拉-9 装备了战后第一批航空团，并参加了后来的朝鲜战争。"
 ad_chi_tech_mig9:0 "米格-9"
 ad_chi_tech_mig9_desc:0 "米格-9 是苏联第一种服役的喷气战斗机，也是中国喷气航空兵的开端。"
 ad_chi_tech_gamma2e:0 "诺斯罗普 伽马 2E"
 ad_chi_tech_gamma2e_desc:0 "伽马 2E 轻型攻击机曾在中国组装，1937 年用于攻击日军行军纵队。"
 ad_chi_tech_hs123:0 "亨舍尔 Hs 123"
 ad_chi_tech_hs123_desc:0 "1937 年从德国购入的十二架 Hs 123 俯冲轰炸机一直执行近距支援任务到 1941 年。"
 ad_chi_tech_a19:0 "伏尔梯 A-19"
 ad_chi_tech_a19_desc:0 "A-19（V-11）攻击机是 1930 年代末中国最先进的对地攻击机，装有 20 毫米机关炮。"
 ad_chi_tech_mosquito_fb6:0 "蚊式 FB Mk VI"
 ad_chi_tech_mosquito_fb6_desc:0 "木质结构、高速且火力凶猛的蚊式战斗轰炸机为中国空军带来精确打击能力。"
 ad_chi_tech_il10:0 "伊尔-10"
 ad_chi_tech_il10_desc:0 "伊尔-10 装甲强击机成为新中国空军标准的近距支援机型。"
 ad_chi_tech_he111a:0 "亨克尔 He 111A"
 ad_chi_tech_he111a_desc:0 "1936 年中国购入早期型 He 111 轰炸机，执行了对日军目标的首次远程轰炸。"
 ad_chi_tech_sb2m:0 "图波列夫 SB 2M"
 ad_chi_tech_sb2m_desc:0 "苏联 SB 轰炸机构成中国轰炸机部队的核心，曾空袭台湾与日占区基地。"
 ad_chi_tech_br20:0 "菲亚特 BR.20 鹳"
 ad_chi_tech_br20_desc:0 "1930 年代末，少量意大利 BR.20 轰炸机在中国空军服役。"
 ad_chi_tech_db3:0 "伊尔-4（DB-3）"
 ad_chi_tech_db3_desc:0 "DB-3 远程轰炸机执行了 1938 年著名的对日“纸弹”空袭，并长期担任中国空军唯一的远程轰炸力量。"
 ad_chi_tech_b25c:0 "B-25C 米切尔"
 ad_chi_tech_b25c_desc:0 "租借法案提供的 B-25 米切尔装备了中美混合联队的轰炸机中队。"
 ad_chi_tech_tu2:0 "图-2"
 ad_chi_tech_tu2_desc:0 "图-2 快速轰炸机成为战后中国轰炸机部队的中坚。"
 ad_chi_tech_b24j:0 "B-24J 解放者"
 ad_chi_tech_b24j_desc:0 "四发 B-24 解放者使中国第一次具备打击日军补给线的真正战略轰炸能力。"
 ad_chi_tech_g4m2:0 "一式陆攻二二型"
 ad_chi_tech_g4m2_desc:0 "战争末期缴获的一式陆攻被用于海上巡逻与运输任务。"
 ad_chi_tech_ki15:0 "九七式司令部侦察机"
 ad_chi_tech_ki15_desc:0 "战前从日本购入的高速侦察机，是中国空军重要的空中侦察力量。"
 ad_chi_tech_pby5:0 "PBY-5 卡特琳娜"
 ad_chi_tech_pby5_desc:0 "卡特琳娜水上飞机在长江与华南沿海执行海上巡逻与搜救任务。"
 ad_chi_tech_c47:0 "C-47 空中列车"
 ad_chi_tech_c47_desc:0 "C-47 是“驼峰航线”的主力运输机，把物资从印度空运至中国。"
 ad_chi_tech_f5:0 "F-5 闪电侦察机"
 ad_chi_tech_f5_desc:0 "F-5 照相侦察机为中国战区绘制了日军部署图。"
 ad_chi_tech_mosquito_pr:0 "蚊式 PR Mk IX"
 ad_chi_tech_mosquito_pr_desc:0 "高空蚊式侦察机深入日占中国与日本本土执行侦察任务。"
 ad_chi_tech_engine_r1820:0 "$ad_engine_usa_r1820_1x$"
 ad_chi_tech_engine_r1820_desc:0 "授权生产的莱特旋风星型发动机，装备霍克 III 与伽马 2E。"
 ad_chi_tech_engine_v1710:0 "$ad_engine_usa_v1710_1x$"
 ad_chi_tech_engine_v1710_desc:0 "V-1710 液冷发动机是 P-40 系列的标准动力。"
 ad_chi_tech_engine_r2800:0 "$ad_engine_usa_r2800_1x$"
 ad_chi_tech_engine_r2800_desc:0 "2000 马力的双黄蜂发动机赋予雷电战斗机速度与坚固性。"
 ad_chi_tech_engine_v1650:0 "$ad_engine_usa_v1650_1x$"
 ad_chi_tech_engine_v1650_desc:0 "授权生产的梅林发动机使野马成为远程护航战斗机。"
 ad_chi_tech_engine_r2600:0 "$ad_engine_usa_r2600_2x$"
 ad_chi_tech_engine_r2600_desc:0 "双旋风发动机是 B-25 米切尔中型轰炸机的动力。"
 ad_chi_tech_engine_r1830:0 "$ad_engine_usa_r1830_2x$"
 ad_chi_tech_engine_r1830_desc:0 "十四缸双黄蜂发动机用于 C-47、PBY 与 B-24。"
 ad_chi_tech_engine_j33:0 "$ad_engine_usa_j33_1x$"
 ad_chi_tech_engine_j33_desc:0 "J33 离心式涡喷发动机是 P-80 流星的动力。"
 ad_chi_tech_engine_m25:0 "$ad_engine_sov_m25_1x$"
 ad_chi_tech_engine_m25_desc:0 "M-25 星型发动机是伊-15 与早期伊-16 的标准动力。"
 ad_chi_tech_engine_m62:0 "$ad_engine_sov_m62_1x$"
 ad_chi_tech_engine_m62_desc:0 "功率提升的 M-62 用于伊-16 24 型与伊-153。"
 ad_chi_tech_engine_m82:0 "$ad_engine_sov_m82_1x$"
 ad_chi_tech_engine_m82_desc:0 "M-82 系列发动机用于拉-5/拉-9 战斗机与图-2 轰炸机。"
 ad_chi_tech_engine_am42:0 "$ad_engine_sov_am42_1x$"
 ad_chi_tech_engine_am42_desc:0 "AM-42 是专为伊尔-10 装甲强击机研制的发动机。"
 ad_chi_tech_engine_m103:0 "$ad_engine_sov_m103_2x$"
 ad_chi_tech_engine_m103_desc:0 "两台 M-103 液冷发动机为 SB 2M 快速轰炸机提供动力。"
 ad_chi_tech_engine_m34:0 "$ad_engine_sov_m34_2x$"
 ad_chi_tech_engine_m34_desc:0 "M-34 发动机用于 DB-3 远程轰炸机。"
 ad_chi_tech_engine_rd20:0 "$ad_engine_sov_rd20_2x$"
 ad_chi_tech_engine_rd20_desc:0 "RD-20 是容克 Jumo 004 的苏联仿制型，用于米格-9。"
 ad_chi_tech_engine_kotobuki:0 "$ad_engine_kotobuki_1x$"
 ad_chi_tech_engine_kotobuki_desc:0 "中岛“寿”星型发动机用于九七式战斗机与九七式司侦。"
 ad_chi_tech_engine_sakae:0 "$ad_engine_sakae_1x$"
 ad_chi_tech_engine_sakae_desc:0 "荣 14 缸星型发动机用于零式战斗机与一式战。"
 ad_chi_tech_engine_homare:0 "$ad_engine_homare_1x$"
 ad_chi_tech_engine_homare_desc:0 "1900 马力的“誉”发动机用于四式战。"
 ad_chi_tech_engine_kasei:0 "$ad_engine_kasei_2x$"
 ad_chi_tech_engine_kasei_desc:0 "两台火星发动机为一式陆攻提供动力。"
 ad_chi_tech_engine_bmw132:0 "$ad_engine_bmw_132_1x$"
 ad_chi_tech_engine_bmw132_desc:0 "宝马 132 发动机用于 Hs 123 俯冲轰炸机。"
 ad_chi_tech_engine_bmw_vi:0 "$ad_engine_bmw_vi_2x$"
 ad_chi_tech_engine_bmw_vi_desc:0 "两台宝马 VI 发动机为售华的早期 He 111A 轰炸机提供动力。"
 ad_chi_tech_engine_merlin:0 "$ad_engine_merlin_20_28_38_2x$"
 ad_chi_tech_engine_merlin_desc:0 "两台梅林 XX 发动机赋予蚊式卓越的速度。"
 ad_chi_tech_gun_m1919:0 "$ad_mg_m1919_1x$"
 ad_chi_tech_gun_m1919_desc:0 "早期中国战斗机使用的美制 7.62 毫米航空机枪。"
 ad_chi_tech_gun_shkas:0 "$ad_mg_shkas_1x$"
 ad_chi_tech_gun_shkas_desc:0 "高射速的 ShKAS 是波利卡波夫战斗机与苏联援华轰炸机的标准武器。"
 ad_chi_tech_gun_mg17:0 "$ad_mg17_1x$"
 ad_chi_tech_gun_mg17_desc:0 "德制 7.92 毫米机枪，含用于炮塔的 MG 81 活动机枪。"
 ad_chi_tech_gun_m2:0 "$ad_mg_m2_1x$"
 ad_chi_tech_gun_m2_desc:0 "12.7 毫米勃朗宁重机枪使美援战斗机具备真正的毁伤能力。"
 ad_chi_tech_gun_type89:0 "$ad_mg_type89_1x$"
 ad_chi_tech_gun_type89_desc:0 "从缴获日机上拆用的日本陆军 7.7 毫米机枪。"
 ad_chi_tech_gun_shvak20:0 "$ad_cannon_shvak20_1x$"
 ad_chi_tech_gun_shvak20_desc:0 "ShVAK 是苏联标准的 20 毫米航空机关炮。"
 ad_chi_tech_gun_ubs:0 "$ad_mg_ubs_1x$"
 ad_chi_tech_gun_ubs_desc:0 "UBS 重机枪在战争后期取代 ShKAS 装备苏制战斗机。"
 ad_chi_tech_gun_type99:0 "$ad_cannon_type99_2x$"
 ad_chi_tech_gun_type99_desc:0 "九九式机关炮是零式与一式战的主要武器。"
 ad_chi_tech_gun_hispano:0 "$ad_cannon_hispano_1_1x$"
 ad_chi_tech_gun_hispano_desc:0 "英制西斯潘诺机关炮装备蚊式夜间与攻击型。"
 ad_chi_tech_gun_ho103:0 "$ad_mg_ho103_1x$"
 ad_chi_tech_gun_ho103_desc:0 "Ho-103 重机枪装备日军后期战斗机。"
 ad_chi_tech_gun_ns23:0 "$ad_cannon_ns23_1x$"
 ad_chi_tech_gun_ns23_desc:0 "NS-23 成为喷气时代苏联标准机炮，装备伊尔-10 与米格-9。"
 ad_chi_tech_ord_fab100:0 "$ad_bomb_fab100_1x$"
 ad_chi_tech_ord_fab100_desc:0 "苏制 100 公斤通用航空炸弹，供 SB 与 DB-3 使用。"
 ad_chi_tech_ord_ao10:0 "$ad_bomb_ao10_1x$"
 ad_chi_tech_ord_ao10_desc:0 "轻型杀伤炸弹，用于波利卡波夫战斗机的对地攻击。"
 ad_chi_tech_ord_fab250:0 "$ad_baybomb_fab250_2x$"
 ad_chi_tech_ord_fab250_desc:0 "250 公斤 FAB 炸弹成为中国轰炸机的标准中型炸弹。"
 ad_chi_tech_ord_fab500:0 "$ad_baybomb_fab500_1x$"
 ad_chi_tech_ord_fab500_desc:0 "500 公斤重型炸弹，用于攻击港口与铁路枢纽。"
 ad_chi_tech_ord_anm30:0 "$ad_bomb_anm30_1x$"
 ad_chi_tech_ord_anm30_desc:0 "美制 100 磅通用炸弹，供租借法案机型使用。"
 ad_chi_tech_ord_rs82:0 "$ad_rocket_rs82_1x$"
 ad_chi_tech_ord_rs82_desc:0 "苏制 82 毫米空对地火箭弹，用于打击行军纵队与船只。"
 ad_chi_tech_ord_type92:0 "$ad_baybomb_a_type92_250kg$"
 ad_chi_tech_ord_type92_desc:0 "缴获的日本 250 公斤炸弹，用于缴获的轰炸机。"
 ad_chi_tech_ord_anm57:0 "$ad_bomb_anm57_1x$"
 ad_chi_tech_ord_anm57_desc:0 "250 磅 AN-M57 是中国战场的通用主力炸弹。"
 ad_chi_tech_ord_hvar:0 "$ad_rocket_hvar_2x$"
 ad_chi_tech_ord_hvar_desc:0 "高速航空火箭弹为战争后期战斗机提供了强大的反舰火力。"
 SLOT_chinaair_folder:0 "§Y中国空军§!\n"
 chinaair_folder:0 "中国空军"
 chinaair_folder_tab:0 "中国空军"
 CHI_air_unlock.1.t:0 "飞机科技研究权已获得"
 CHI_air_unlock.1.d:0 "中华民国已经获得独立的航空科技研究权，科研界面中新增了「中国空军」科技页。\n\n由于黑冰的科研界面会缓存布局，第一次打开该页时，科技之间的连线（箭头）可能不显示。请先保存游戏并重新载入一次，连线与图标位置就会恢复正常。"
 CHI_air_unlock.1.a:0 "明白了。"
 CHI_air_request_title:0 "申请航空科技研究权"
 CHI_air_request_desc:0 "我们的空军还没有独立的研究体系。只要能证明我们拥有像样的工业基础——或者足够坚定的政府——盟国与顾问就会帮我们建立起来。\n\n满足以下任意一项即可申请：\n  · 至少 2 座飞机装配厂，或\n  · 至少 2 座发动机装配厂，或\n  · 当前执政党奉行专制主义 / 专制统治意识形态。"
 CHI_air_request_button:0 "提交申请"
 CHI_air_request_tooltip:0 "满足条件后提交，即可解锁中国空军科技树。解锁后记得先存档再读档一次，科技连线才会正常绘制。"
 SLOT_chinaair_request_folder:0 "§Y申请航空科技研究权§!\n"
 CHI_ARMOR_REQ_TT:0 "需要其中之一：\n· 坦克装配厂 ≥2 且发动机装配厂 ≥2\n· 已完成「早期拖拉机」研究\n· 已完成国策「中国装甲部队」\n· 已完成国策「聘请苏联设计商」"
 CHI_armor_unlock.1.t:0 "中国坦克科技树使用提示"
 CHI_armor_unlock.1.d:0 "£chi_armor_tip\n\n「中国空军」与「中国坦克」科技页已经可用。\n\n由于黑冰的科研界面会缓存布局，第一次打开这些科技页时，图标、名字与科技之间的连线可能不显示。请先保存游戏并重新载入一次，之后就会恢复正常。"
 CHI_armor_unlock.1.a:0 "明白了。"
 CHI_air_unlock.2.t:0 "中国坦克科技树使用提示"
 CHI_air_unlock.2.d:0 "「中国空军」与「中国坦克」科技页已经可用。\n\n由于黑冰的科研界面会缓存布局，第一次打开这些科技页时，图标、名字与科技之间的连线可能不显示。请先保存游戏并重新载入一次，之后就会恢复正常。"
 CHI_air_unlock.2.a:0 "明白了。"
